name: Python application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      matrix:
        python-version: [3.11]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-timeout pytest-cov
      timeout-minutes: 5
    
    - name: Set environment variables
      run: |
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/testdb" >> $GITHUB_ENV
        echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
    
    - name: Start PostgreSQL service
      uses: harmon758/postgresql-action@v1
      with:
        postgresql version: '15'
        postgresql db: testdb
        postgresql user: postgres
        postgresql password: postgres
    
    - name: Wait for PostgreSQL to be ready
      run: |
        echo "Waiting for PostgreSQL..."
        for i in {1..30}; do
          if pg_isready -h localhost -p 5432 -U postgres 2>/dev/null; then
            echo "✅ PostgreSQL is ready!"
            psql -h localhost -U postgres -d testdb -c "SELECT version();" 2>/dev/null && break
          fi
          echo "⏳ Waiting... ($i/30)"
          sleep 2
        done
      env:
        PGPASSWORD: postgres
      timeout-minutes: 2
    
    - name: Run pytest
      run: |
        pytest -v --timeout=10 --tb=short --maxfail=1
      env:
        PYTHONPATH: ${{ github.workspace }}
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      timeout-minutes: 5
